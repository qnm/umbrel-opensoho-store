version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: qnm-opensoho_server_1
      APP_PORT: 8090

  init:
    image: ghcr.io/opensoho/opensoho:v0.16.0@sha256:d7e16b2bd0ad0e628f28232f85ef9c8533c548cbdcee7a15ea4c40d5d9512e07
    command: ["superuser", "upsert", "admin@opensoho.local", "${APP_PASSWORD}"]
    environment:
      OPENSOHO_SHARED_SECRET: $APP_PASSWORD
      APP_PASSWORD: $APP_PASSWORD
    volumes:
      - ${APP_DATA_DIR}/data/pb_data:/ko-app/pb_data

  server:
    image: ghcr.io/opensoho/opensoho:v0.16.0@sha256:d7e16b2bd0ad0e628f28232f85ef9c8533c548cbdcee7a15ea4c40d5d9512e07
    command: ["serve", "--http", "0.0.0.0:8090"]
    init: true
    restart: on-failure
    ports:
      - "18090:8090"
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      OPENSOHO_SHARED_SECRET: $APP_PASSWORD
    volumes:
      - ${APP_DATA_DIR}/data/pb_data:/ko-app/pb_data
