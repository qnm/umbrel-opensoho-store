manifestVersion: 1
id: qnm-opensoho
storage:
  dataRoot: data
category: networking
name: OpenSOHO
version: "0.15.2"
tagline: Lightweight network management for OpenWRT devices
icon: https://raw.githubusercontent.com/rubenbe/opensoho/main/logo.svg
description: >-
  Sign in with the username and password shown in Umbrel. Point your OpenWRT
  devices at http://<umbrel-ip>:18090 so OpenSOHO sees their real IP
  addresses. Their shared secret is the same password.


  OpenSOHO is a lightweight network management system for small office/home
  office (SOHO) environments, designed to manage 2 to 20 OpenWRT-based network
  devices. It is a simpler alternative to OpenWISP for networks that are too
  small to need a full-blown controller.


  Features include WiFi SSID configuration across 2.4, 5 and 6 GHz radios,
  radio frequency management, LED configuration, device health monitoring,
  connected client tracking, VLAN support, PoE and LLDP network overviews, and
  Home Assistant integration.


  Compatible with openwisp-config and openwisp-monitoring packages on
  OpenWRT 24.10.x DSA.
releaseNotes: >-
  Important: VLAN interface names are now shorter, so OpenSOHO pushes new
  configuration to every device after this update. To roll out in stages,
  disable some APs before you update.


  Devices showing 10.21.0.1 as their IP: point them at port 18090 instead of
  8090, for example http://<umbrel-ip>:18090.


  - 6 GHz WiFi support, with better Wifi 7 and multi-radio handling

  - PoE and LLDP data from your devices, with a network overview

  - Dashboard shows a frequency overview and AP WiFi versions

  - Radio band is now selectable and checked against what the radio supports

  - SSIDs and passwords that contain a quote no longer break device config

  - Fixes for device registration and ethernet bridges on x86 VMs


  Full release notes: https://github.com/rubenbe/opensoho/releases

developer: rubenbe
website: https://github.com/rubenbe/opensoho
dependencies: []
repo: https://github.com/rubenbe/opensoho
